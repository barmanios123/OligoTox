[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-audit"
version = "0.1.0"
description = "Six checks on whether a model's score on a dataset means what it appears to mean"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.scripts]
evidence-audit = "evidence_audit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
