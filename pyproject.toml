[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oligotox"
version = "0.1.0"
description = "Oligonucleotide toxicity modeling toolkit"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "streamlit>=1.30",
]

[project.optional-dependencies]
# Needed by the scripts the README documents, not by the app or the tests.
# Keeping them out of requirements.txt keeps the deployed app small.
scripts = [
    "matplotlib>=3.8",   # the results, baselines and calibration figures
    "pypdf>=5.0",        # parsing the NAR 2022 hepatotoxicity supplement
    "xlrd>=2.0",         # the Papargyri workbook, a legacy .xls
    "openpyxl>=3.1",     # any modern .xlsx
]
efficacy = [
    "torch>=2.0",
]
api = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "pydantic>=2.0",
]
advanced = [
    "plotly>=5.0",
    "transformers>=4.30",
    "gseapy>=1.0",
    "datasets>=2.0",
    "pyyaml>=6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
