name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps
          # pytest.ini runs packages/evidence-audit/tests, and
          # tests/test_audit_shim.py imports oligotox.audit, which wraps it.
          # Without this the suite fails on import, which is what every run
          # since the package was split out has been doing.
          pip install -e packages/evidence-audit --no-deps
          pip install pytest
      # Both the logs endpoint and artifact downloads want a token, even on a
      # public repo, so a red run could not be read at all. Annotations are
      # public, so the failures are emitted as those.
      - name: Test
        run: |
          set +e
          pytest -q 2>&1 | tee pytest.out
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^(FAILED|ERROR)" pytest.out | while IFS= read -r line; do
              echo "::error::$line"
            done
            grep -E "^E  " pytest.out | head -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"
