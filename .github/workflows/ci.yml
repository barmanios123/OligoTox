name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps
          # pytest.ini runs packages/evidence-audit/tests, and
          # tests/test_audit_shim.py imports oligotox.audit, which wraps it.
          # Without this the suite fails on import, which is what every run
          # since the package was split out has been doing.
          pip install -e packages/evidence-audit --no-deps
          pip install pytest
      - name: Test
        run: pytest -q
