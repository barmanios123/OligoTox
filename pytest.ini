[pytest]
# evidence-audit keeps its own tests beside its own code. Without it listed
# here, `pytest` from the repo root collects nothing from it and the package's
# checks go unrun in CI while the suite still looks green.
testpaths = tests packages/evidence-audit/tests
norecursedirs =
    .git
    .venv
    build
    dist
    data/raw
    data/raw/external_repos
    data/raw/github_repos
    archive
    artifacts
python_files = test_*.py *_test.py
